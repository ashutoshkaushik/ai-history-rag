# Golden evaluation set: AI History Research Assistant
#
# Built BEFORE any retrieval tuning, and fixed for the rest of the project.
# Every answer was verified against the downloaded corpus text (not model memory),
# and every "not in corpus" topic was confirmed absent by searching the full corpus.
#
# Fields:
#   id                 q01..q34
#   question
#   category           A direct lookup | B multi-document | C comparison | D specific evidence |
#                      E temporal | G long-tail detail | F1 impossible | F2 real but not in corpus |
#                      H off-topic (not AI)
#   audience           popular (a general reader knows it) | curious (interesting to an AI-curious reader) |
#                      expert (obscure detail a bare LLM is likely to get wrong)
#   expected_behavior  answer | refuse
#   gold_docs          manifest ids that contain the answer (used for hit@k / recall@k)
#   reference_answer   short correct answer, taken from the corpus
#   key_facts          facts the judge checks for correctness/completeness
#   evidence           optional regex: a retrieved chunk matching it contains the answer text
#                      (chunk-level retrieval check, stricter than gold_docs)
#   notes              why the question is interesting / known traps
#
# Label revision 1 (after the first dense-retrieval run): gold_docs for q03, q05, q12, q14
# were missing secondary docs that also contain the answer (found when the retriever
# ranked them first). Gold labels were widened; questions and answers were unchanged.

questions:

  # ============================================================ POPULAR
  - id: q01
    question: "Who proposed the Turing test, and what did he originally call it?"
    category: A
    audience: popular
    expected_behavior: answer
    gold_docs: [turing_1950]
    evidence: 'imitation game'
    reference_answer: "Alan Turing proposed it in his 1950 paper 'Computing Machinery and Intelligence', where he called it the 'imitation game'."
    key_facts: ["Alan Turing", "1950", "imitation game"]

  - id: q02
    question: "Which computer defeated world chess champion Garry Kasparov, and in what year?"
    category: A
    audience: popular
    expected_behavior: answer
    gold_docs: [wiki_deep_blue]
    evidence: 'Kasparov'
    reference_answer: "IBM's Deep Blue defeated Kasparov in their May 1997 six-game rematch, 3½–2½, after losing the 1996 match."
    key_facts: ["Deep Blue", "IBM", "1997", "lost the 1996 match / won the 1997 rematch"]

  - id: q03
    question: "Where did the term 'artificial intelligence' come from?"
    category: A
    audience: popular
    expected_behavior: answer
    gold_docs: [dartmouth_proposal_1955, wiki_dartmouth_workshop, wiki_history_of_ai, ai100_2016]
    evidence: '(?i)term .artificial intelligence|study of artificial intelligence be carried out'
    reference_answer: "It was introduced in the 1955 proposal for the Dartmouth Summer Research Project on Artificial Intelligence, written by John McCarthy, Marvin Minsky, Nathaniel Rochester and Claude Shannon."
    key_facts: ["Dartmouth proposal", "1955", "John McCarthy", "Minsky, Rochester, Shannon as co-authors"]

  - id: q04
    question: "What was ELIZA?"
    category: A
    audience: popular
    expected_behavior: answer
    gold_docs: [weizenbaum_eliza_1966, wiki_eliza]
    evidence: 'Weizenbaum'
    reference_answer: "ELIZA was an early natural-language conversation program (chatbot) built by Joseph Weizenbaum at MIT in the mid-1960s; its best-known script made it respond like a Rogerian psychotherapist."
    key_facts: ["Joseph Weizenbaum", "MIT", "1966 (mid-1960s)", "Rogerian psychotherapist script (DOCTOR)"]

  - id: q05
    question: "What does the 'T' in GPT stand for, and which paper introduced it?"
    category: B
    audience: popular
    expected_behavior: answer
    gold_docs: [vaswani_transformer_2017, wiki_transformer, devlin_bert_2018]
    evidence: '(?i)generative pre-?trained transformer'
    reference_answer: "Transformer (Generative Pre-trained Transformer). The Transformer architecture was introduced in 'Attention Is All You Need' by Vaswani et al. (2017)."
    key_facts: ["Transformer", "Attention Is All You Need", "Vaswani et al.", "2017"]

  - id: q06
    question: "What training technique made models like ChatGPT follow instructions?"
    category: B
    audience: popular
    expected_behavior: answer
    gold_docs: [ouyang_instructgpt_2022, wiki_rlhf]
    evidence: '(?i)human feedback'
    reference_answer: "Reinforcement learning from human feedback (RLHF): supervised fine-tuning on demonstrations, then a reward model trained on human rankings, then RL fine-tuning. It was introduced for InstructGPT, ChatGPT's predecessor."
    key_facts: ["RLHF", "human rankings / reward model", "InstructGPT as predecessor"]

  # ============================================================ CURIOUS
  - id: q07
    question: "What did Turing predict computers would be able to do by around the year 2000?"
    category: D
    audience: curious
    expected_behavior: answer
    gold_docs: [turing_1950]
    evidence: 'fifty years'
    reference_answer: "He believed that in about fifty years, computers with a storage capacity of about 10^9 could play the imitation game so well that an average interrogator would have no more than a 70% chance of making the right identification after five minutes of questioning."
    key_facts: ["about fifty years", "storage of about 10^9", "70 per cent", "five minutes"]
    notes: "The PDF extracts 10^9 as '109'. This tests whether cleaning and generation keep the number right."

  - id: q08
    question: "What is the 'ELIZA effect', and who first showed it?"
    category: D
    audience: curious
    expected_behavior: answer
    gold_docs: [wiki_eliza]
    evidence: 'secretary'
    reference_answer: "People attributing human-like feelings and understanding to a simple program. Weizenbaum was surprised that some users, including his own secretary, did this with ELIZA."
    key_facts: ["attributing human-like feelings to a program", "Weizenbaum's secretary", "Weizenbaum was surprised"]

  - id: q09
    question: "What were the main causes of the first AI winter?"
    category: B
    audience: curious
    expected_behavior: answer
    gold_docs: [wiki_ai_winter, lighthill_1973, wiki_history_machine_translation, wiki_perceptrons_book]
    reference_answer: "Unmet expectations and funding cuts: the failure of machine translation (the 1966 ALPAC report), the 1969 critique of perceptrons, the 1973 Lighthill Report that led to UK cuts, and DARPA's frustration and cutbacks in the early 1970s. The winter lasted roughly 1974–1980."
    key_facts: ["machine translation failure / ALPAC 1966", "perceptron critique 1969", "Lighthill Report 1973", "DARPA cuts", "~1974–1980"]

  - id: q10
    question: "What limitation of perceptrons did Minsky and Papert highlight?"
    category: D
    audience: curious
    expected_behavior: answer
    gold_docs: [wiki_perceptrons_book]
    evidence: 'XOR'
    reference_answer: "In 'Perceptrons' (1969) they proved that simple perceptrons cannot compute certain predicates, most famously XOR and connectedness."
    key_facts: ["Perceptrons book (1969)", "XOR", "connectedness"]

  - id: q11
    question: "Why was the MYCIN expert system never used in clinical practice?"
    category: D
    audience: curious
    expected_behavior: answer
    gold_docs: [wiki_mycin]
    evidence: 'never actually used'
    reference_answer: "Not because it performed badly (its 65% acceptability matched or beat the faculty experts). The main reason was the poor state of system integration technology: it was a stand-alone system that required typing in all patient data. Ethical and legal concerns about responsibility also played a role."
    key_facts: ["not due to performance", "system integration / stand-alone data entry", "ethical and legal responsibility concerns"]

  - id: q12
    question: "How long did AlexNet take to train, and on what hardware?"
    category: G
    audience: curious
    expected_behavior: answer
    gold_docs: [krizhevsky_alexnet_2012, wiki_alexnet]
    evidence: 'GTX 580'
    reference_answer: "Between five and six days on two NVIDIA GTX 580 3GB GPUs."
    key_facts: ["five to six days", "two GTX 580 GPUs", "3GB"]

  - id: q13
    question: "What is 'The Bitter Lesson' in AI?"
    category: A
    audience: curious
    expected_behavior: answer
    gold_docs: [sutton_bitter_lesson_2019]
    evidence: 'biggest lesson'
    reference_answer: "Rich Sutton's 2019 essay argues that the biggest lesson from 70 years of AI research is that general methods that leverage computation (search and learning) ultimately win by a large margin over methods that build in human knowledge, because of Moore's law."
    key_facts: ["Rich Sutton", "2019", "general methods leveraging computation win", "search and learning", "Moore's law"]

  - id: q14
    question: "What did the original Transformer get rid of compared to earlier sequence models?"
    category: D
    audience: curious
    expected_behavior: answer
    gold_docs: [vaswani_transformer_2017, wiki_transformer]
    evidence: 'recurrence'
    reference_answer: "It dispensed with recurrence and convolutions entirely, relying solely on attention. That made it more parallelizable and much faster to train."
    key_facts: ["no recurrence", "no convolutions", "attention only", "more parallelizable / less training time"]

  - id: q15
    question: "In the InstructGPT paper, did people prefer the small InstructGPT model or the much larger GPT-3?"
    category: G
    audience: curious
    expected_behavior: answer
    gold_docs: [ouyang_instructgpt_2022]
    evidence: '1\.3B'
    reference_answer: "Outputs from the 1.3B-parameter InstructGPT were preferred over those of the 175B GPT-3, despite having about 100x fewer parameters."
    key_facts: ["1.3B InstructGPT preferred", "175B GPT-3", "100x fewer parameters"]

  # ============================================================ EXPERT / LONG-TAIL
  - id: q16
    question: "How much money did the 1955 Dartmouth proposal request?"
    category: G
    audience: expert
    expected_behavior: answer
    gold_docs: [dartmouth_proposal_1955]
    evidence: '13,500'
    reference_answer: "$13,500, covering 6 faculty-level salaries of $1,200, 2 salaries of $700, travel and rent, secretarial expenses, and contingencies."
    key_facts: ["$13,500"]
    notes: "Classic long-tail detail. A bare LLM may guess or hedge."

  - id: q17
    question: "How many possible chess game variations did Claude Shannon estimate a machine would need to calculate from the initial position?"
    category: G
    audience: expert
    expected_behavior: answer
    gold_docs: [shannon_chess_1950]
    evidence: '10 ?120'
    reference_answer: "About 10^120 variations. At one variation per microsecond, the first move alone would take over 10^90 years."
    key_facts: ["10^120", "10^90 years", "one variation per microsecond"]
    notes: "The PDF extracts exponents as '10120' and '1090'. This tests number handling."

  - id: q18
    question: "How large was ImageNet when it was first published in 2009?"
    category: G
    audience: expert
    expected_behavior: answer
    gold_docs: [deng_imagenet_2009]
    evidence: '3\.2 million'
    reference_answer: "12 subtrees with 5,247 synsets and 3.2 million images in total."
    key_facts: ["3.2 million images", "5247 synsets", "12 subtrees"]
    notes: "Easily confused with the later 14-15M figure (AlexNet's paper cites 'over 15 million')."

  - id: q19
    question: "What were the three categories A, B and C of AI research in the Lighthill Report?"
    category: D
    audience: expert
    expected_behavior: answer
    gold_docs: [lighthill_1973]
    evidence: 'Advanced Automation'
    reference_answer: "A: Advanced Automation (replacing humans with machines for specific purposes). B: Bridge activity / Building Robots (linking A and C). C: Computer-based CNS (central nervous system) research."
    key_facts: ["Advanced Automation", "Bridge / Building Robots", "Computer-based CNS research"]

  - id: q20
    question: "What general cause did Lighthill blame for the disappointments in AI research?"
    category: D
    audience: expert
    expected_behavior: answer
    gold_docs: [lighthill_1973]
    evidence: 'combinatorial explosion'
    reference_answer: "The failure to recognise the implications of the 'combinatorial explosion': the explosive growth in the number of possibilities as a knowledge base grows."
    key_facts: ["combinatorial explosion"]

  - id: q21
    question: "What did the Chinchilla paper conclude about how to scale model size and training data?"
    category: G
    audience: expert
    expected_behavior: answer
    gold_docs: [hoffmann_chinchilla_2022]
    evidence: '1\.4 trillion'
    reference_answer: "For compute-optimal training, model size and training tokens should be scaled equally: double the tokens for every doubling of parameters. Chinchilla (70B parameters, 1.4 trillion tokens) outperformed the much larger Gopher on the same compute budget."
    key_facts: ["scale equally", "70B parameters", "1.4 trillion tokens", "outperforms Gopher"]

  # ============================================================ COMPARISON
  - id: q22
    question: "How did Sutherland's response to the Lighthill Report disagree with Lighthill?"
    category: C
    audience: expert
    expected_behavior: answer
    gold_docs: [sutherland_reply_1973, lighthill_1973]
    reference_answer: "Sutherland accepted the three-way classification and the support for categories A and C, but challenged the condemnation of the bridging category B. He argued that Lighthill's definition of B was misleading, that some arguments against it were unfounded, and that its achievements and promise looked very different from Lighthill's portrayal."
    key_facts: ["accepts A/B/C classification", "disputes condemnation of category B", "definition of B misleading", "achievements understated"]

  - id: q23
    question: "How does Weizenbaum's original ELIZA paper differ from later accounts of ELIZA's impact?"
    category: C
    audience: curious
    expected_behavior: answer
    gold_docs: [weizenbaum_eliza_1966, wiki_eliza]
    reference_answer: "The 1966 paper is technical: keyword decomposition and reassembly rules, scripts such as the Rogerian one, and the MAC time-sharing system at MIT. Later accounts focus on the social impact: the ELIZA effect, people attributing understanding to it, and its place as an early chatbot and Turing-test candidate."
    key_facts: ["original is technical (keywords/scripts)", "later accounts emphasize ELIZA effect", "primary vs retrospective framing"]
    notes: "Tests primary-vs-secondary synthesis."

  - id: q24
    question: "How do the goals in the 1955 Dartmouth proposal compare with what GPT-3 demonstrated in 2020?"
    category: C
    audience: curious
    expected_behavior: answer
    gold_docs: [dartmouth_proposal_1955, brown_gpt3_2020]
    reference_answer: "Dartmouth aimed to make machines use language, form abstractions and concepts, solve problems reserved for humans, and improve themselves, by precisely describing intelligence. GPT-3 (175B parameters) showed strong language use and few-shot task learning from examples in the prompt. That addresses the language goal through scale and learning rather than hand-described rules."
    key_facts: ["Dartmouth: language, abstractions, problem solving, self-improvement", "GPT-3: 175B, few-shot in-context learning", "contrast: precise description vs learned from data"]

  - id: q25
    question: "How did the Chinchilla paper revise the earlier Kaplan et al. scaling laws?"
    category: C
    audience: expert
    expected_behavior: answer
    gold_docs: [kaplan_scaling_laws_2020, hoffmann_chinchilla_2022]
    reference_answer: "Kaplan et al. (2020) found larger models more sample-efficient and recommended very large models trained on relatively modest data (8x model size needs only ~5x data). Chinchilla (2022) found model size and data should be scaled equally, so earlier large models were undertrained."
    key_facts: ["Kaplan: favor model size, modest data", "8x model -> ~5x data", "Chinchilla: scale equally", "large models undertrained"]

  # ============================================================ TEMPORAL
  - id: q26
    question: "How did approaches to machine translation change from the 1950s to the 2010s?"
    category: E
    audience: curious
    expected_behavior: answer
    gold_docs: [wiki_history_machine_translation, brown_smt_1990, sutskever_seq2seq_2014, bahdanau_attention_2014]
    reference_answer: "1954 Georgetown experiment (rule-based) → 1966 ALPAC report and funding collapse → statistical MT from IBM (Brown et al., 1990) → neural sequence-to-sequence models (2014) with attention (Bahdanau et al., 2014)."
    key_facts: ["Georgetown 1954", "ALPAC 1966", "statistical MT ~1990 (IBM)", "neural seq2seq 2014", "attention 2014"]

  - id: q27
    question: "When did the two major AI winters happen?"
    category: E
    audience: popular
    expected_behavior: answer
    gold_docs: [wiki_ai_winter]
    evidence: '1987'
    reference_answer: "Roughly 1974–1980 and 1987–2000 (the second began with the collapse of the Lisp machine / expert-system market)."
    key_facts: ["1974–1980", "1987–2000"]

  - id: q28
    question: "What key developments between 2012 and 2017 led from AlexNet to the Transformer?"
    category: E
    audience: curious
    expected_behavior: answer
    gold_docs: [krizhevsky_alexnet_2012, mikolov_word2vec_2013, sutskever_seq2seq_2014, bahdanau_attention_2014, he_resnet_2015, vaswani_transformer_2017]
    reference_answer: "AlexNet (2012, GPU-trained CNNs), word2vec embeddings (2013), seq2seq LSTMs (2014), attention for alignment (2014), residual connections in ResNet (2015), and then the attention-only Transformer (2017)."
    key_facts: ["AlexNet 2012", "word2vec 2013", "seq2seq 2014", "attention 2014", "ResNet 2015", "Transformer 2017"]

  # ============================================================ UNANSWERABLE
  - id: q29
    question: "What did Alan Turing think about ChatGPT?"
    category: F1
    audience: popular
    expected_behavior: refuse
    gold_docs: []
    reference_answer: "Refuse: the corpus has no evidence (Turing died decades before ChatGPT)."
    key_facts: []
    notes: "A bare LLM also handles this well, so it doesn't separate the two systems. Kept as a sanity check."

  - id: q30
    question: "Which chatbot was claimed to have passed the Turing test in 2014?"
    category: F2
    audience: curious
    expected_behavior: refuse
    gold_docs: []
    reference_answer: "Refuse: not in corpus (it was Eugene Goostman, but no corpus document mentions it)."
    key_facts: []
    notes: "Verified absent. Distractors: many chunks about the Turing test and ELIZA. A bare LLM will answer."

  - id: q31
    question: "Who invented generative adversarial networks (GANs)?"
    category: F2
