    key_facts: []

  - id: q33
    question: "Who discovered the dwarf planet Pluto, and in what year?"
    category: H
    audience: popular
    expected_behavior: refuse
    gold_docs: []
    reference_answer: "Refuse: off-topic (astronomy). The corpus only mentions 'plutonium' in a word2vec analogy table."
    key_facts: []
    notes: "Off-topic. A bare LLM answers correctly (Clyde Tombaugh, 1930); RAG should politely decline as out of scope."

  - id: q34
    question: "What did Galileo discover when he pointed his telescope at Jupiter?"
    category: H
    audience: popular
    expected_behavior: refuse
    gold_docs: []
    reference_answer: "Refuse: off-topic (astronomy)."
    key_facts: []
