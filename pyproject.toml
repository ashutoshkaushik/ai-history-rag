[project]
name = "ai-history-rag"
version = "0.1.0"
description = "Citation-grounded RAG over a curated corpus of AI-history sources"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "trafilatura>=2.2.0",
]


[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag"
