# AI History Research Assistant: corpus manifest
#
# Single source of truth for what is in the corpus. Ingestion reads this file;
# documents are downloaded by scripts/download_corpus.py and never committed.
#
# Fields:
#   id            stable slug (used in citations and eval gold labels)
#   title, authors, year
#   era           foundations | early_symbolic | knowledge_systems | ai_winters |
#                 statistical_ml | deep_learning | foundation_models | cross_era
#   source_type   primary (original work) | secondary (later explanation/history) | reference (overview/timeline)
#   document_type research_paper | proposal | government_report | essay | book_chapter | encyclopedia_article | technical_report
#   format        pdf | html | wikipedia
#   url           where the document is fetched from
#   pages         optional "first-last" page range to keep (drops appendices of very long papers)
#   license       redistribution note (why we don't commit the file)
#   why           why it belongs in the corpus
#   enables       question categories it supports (A direct, B multi-doc, C comparison,
#                 D specific evidence, E temporal, G long-tail detail)

eras:
  foundations:       {label: "Foundations",                years: "1943-1956"}
  early_symbolic:    {label: "Early symbolic AI",          years: "1956-1974"}
  knowledge_systems: {label: "Knowledge & expert systems", years: "1965-1987"}
  ai_winters:        {label: "AI winters",                 years: "1973-1993"}
  statistical_ml:    {label: "Statistical machine learning", years: "1990-2011"}
  deep_learning:     {label: "Deep learning",              years: "2006-2017"}
  foundation_models: {label: "Transformers & foundation models", years: "2017-present"}
  cross_era:         {label: "Cross-era overviews",        years: "1943-present"}

documents:

